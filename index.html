<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neo — @iamneo80</title>
    <meta name="description" content="Neo on X. 21,298 followers, 930,406 views." />
    <style>
      :root {
        --bg: #060807;
        --ink: #f2f5f2;
        --muted: #9aa79c;
        --line: rgba(255, 255, 255, 0.09);
        --green: #3dff8e;
        --green-dim: rgba(61, 255, 142, 0.12);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html { color-scheme: dark; }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      main {
        width: 100%;
        max-width: 880px;
        padding: 72px 24px 40px;
        flex: 1;
      }

      /* Hero */
      .kicker {
        font-size: 12px;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: var(--green);
        margin-bottom: 18px;
      }
      h1 {
        font-size: clamp(72px, 18vw, 148px);
        font-weight: 800;
        letter-spacing: -0.04em;
        line-height: 0.95;
      }
      h1 .dot { color: var(--green); }
      .tagline {
        margin-top: 20px;
        font-size: clamp(17px, 3.4vw, 21px);
        color: var(--muted);
        max-width: 46ch;
        line-height: 1.5;
      }
      .tagline strong { color: var(--ink); font-weight: 600; }

      /* Stats */
      .stats {
        display: flex;
        flex-wrap: wrap;
        gap: 0;
        margin-top: 52px;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
      }
      .stat {
        flex: 1 1 160px;
        padding: 26px 8px 26px 0;
      }
      .stat + .stat { padding-left: 28px; border-left: 1px solid var(--line); }
      .stat .num {
        display: block;
        font-size: clamp(30px, 6vw, 42px);
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.1;
      }
      .stat .lbl {
        display: block;
        margin-top: 6px;
        font-size: 11px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--muted);
      }

      /* Photo */
      .photo {
        margin-top: 52px;
      }
      .photo img {
        width: 100%;
        height: auto;
        display: block;
        border-radius: 16px;
        border: 1px solid var(--line);
      }

      /* CTA */
      .cta { margin-top: 52px; }
      .xbtn {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        background: var(--green);
        color: #04140a;
        text-decoration: none;
        font-weight: 700;
        font-size: 16px;
        padding: 14px 28px;
        border-radius: 999px;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
        box-shadow: 0 0 0 0 var(--green-dim);
      }
      .xbtn:hover { transform: translateY(-2px); box-shadow: 0 12px 32px -8px var(--green-dim); }
      .xbtn svg { flex: none; }

      footer {
        width: 100%;
        max-width: 880px;
        padding: 0 24px 36px;
        display: flex;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
        font-size: 13px;
        color: var(--muted);
      }
      footer a { color: var(--muted); text-decoration: none; }
      footer a:hover { color: var(--green); }

      @media (max-width: 560px) {
        main { padding-top: 48px; }
        .stat + .stat { padding-left: 18px; }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="kicker">@iamneo80 — on X</p>
      <h1>Neo<span class="dot">.</span></h1>
      <p class="tagline">Posting on <strong>X</strong>. Nothing else, nowhere else — this page is the whole portfolio.</p>

      <div class="stats" aria-label="X statistics">
        <div class="stat"><span class="num">21,298</span><span class="lbl">Followers</span></div>
        <div class="stat"><span class="num">215</span><span class="lbl">Posts</span></div>
        <div class="stat"><span class="num">930,406</span><span class="lbl">Views</span></div>
      </div>

      <div class="photo">
        <img src="photo.png" alt="Neo banner" />
      </div>

      <div class="cta">
        <a class="xbtn" href="https://x.com/iamneo80" target="_blank" rel="noopener noreferrer">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
          Follow on X
        </a>
      </div>
    </main>

    <footer>
      <span>© Neo</span>
      <a href="https://x.com/iamneo80" target="_blank" rel="noopener noreferrer">x.com/iamneo80</a>
    </footer>
  </body>
</html>
