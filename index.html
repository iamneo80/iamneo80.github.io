<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Neo — personal web page." />
    <link rel="icon" href="data:," />
    <title>Neo</title>
    <style>
      :root {
        --bg: #f4f6f3;
        --surface: #ffffff;
        --ink: #17211c;
        --ink-soft: #47554d;
        --ink-faint: #718078;
        --line: #dce3dc;
        --accent: #14684a;
        --accent-soft: #e3efe8;
        --accent-ink: #0e4d36;
        --ring: rgba(20, 104, 74, 0.16);
        --shadow: 0 24px 60px rgba(23, 33, 28, 0.10), 0 4px 14px rgba(23, 33, 28, 0.06);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #101613;
          --surface: #18201b;
          --ink: #edf3ee;
          --ink-soft: #b7c4bb;
          --ink-faint: #85958a;
          --line: #2a352d;
          --accent: #4cc38a;
          --accent-soft: #1d2f26;
          --accent-ink: #8fe0b6;
          --ring: rgba(76, 195, 138, 0.18);
          --shadow: 0 24px 60px rgba(0, 0, 0, 0.45), 0 4px 14px rgba(0, 0, 0, 0.35);
        }
      }

      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        line-height: 1.55;
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: clamp(20px, 5vw, 56px) 18px 40px;
      }

      main {
        width: 100%;
        max-width: 640px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      /* ---------- Profile card ---------- */
      .profile {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 20px;
        box-shadow: var(--shadow);
        padding: clamp(36px, 7vw, 56px) clamp(22px, 6vw, 48px) clamp(32px, 6vw, 44px);
        text-align: center;
      }

      .monogram {
        width: 104px;
        height: 104px;
        margin: 0 auto 22px;
        border-radius: 50%;
        background: var(--accent-soft);
        border: 1px solid var(--ring);
        box-shadow: 0 0 0 6px var(--accent-soft);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif;
        font-size: 52px;
        font-weight: 600;
        color: var(--accent-ink);
        line-height: 1;
        user-select: none;
      }

      h1 {
        font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif;
        font-size: clamp(44px, 10vw, 64px);
        line-height: 1.05;
        font-weight: 600;
        letter-spacing: -0.01em;
        margin: 0 0 10px;
      }

      .hello {
        margin: 0 auto;
        max-width: 38ch;
        font-size: 17px;
        color: var(--ink-soft);
      }

      .rule {
        width: 44px;
        height: 3px;
        border-radius: 999px;
        background: var(--accent);
        margin: 26px auto 0;
        opacity: 0.85;
      }

      /* ---------- Sections ---------- */
      .section {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 24px clamp(20px, 5vw, 32px) 26px;
      }

      .section h2 {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--ink-faint);
        margin: 0 0 12px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .section h2 svg {
        flex: none;
        color: var(--accent);
      }

      .empty {
        margin: 0;
        font-size: 15.5px;
        color: var(--ink-soft);
      }
      .empty strong {
        color: var(--ink);
        font-weight: 600;
      }

      footer {
        margin-top: 6px;
        text-align: center;
        font-size: 13px;
        color: var(--ink-faint);
      }
      footer .dot { margin: 0 6px; opacity: 0.6; }

      @media (max-width: 420px) {
        .monogram { width: 92px; height: 92px; font-size: 46px; }
        .hello { font-size: 16px; }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="profile" aria-label="Profile">
        <div class="monogram" aria-hidden="true">N</div>
        <h1>Neo</h1>
        <p class="hello">Hello, I&rsquo;m Neo. Welcome to my corner of the web.</p>
        <div class="rule" aria-hidden="true"></div>
      </section>

      <section class="section" aria-label="Photos">
        <h2>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
          Photos
        </h2>
        <p class="empty"><strong>Nothing here yet.</strong> Photos will appear in this space soon &mdash; check back shortly.</p>
      </section>

      <section class="section" aria-label="Links">
        <h2>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
          Links
        </h2>
        <p class="empty"><strong>No links yet.</strong> When Neo adds links &mdash; social profiles, projects, or anything else worth sharing &mdash; they&rsquo;ll be listed here.</p>
      </section>

      <footer>
        Neo<span class="dot" aria-hidden="true">&middot;</span>Personal page
      </footer>
    </main>
  </body>
</html>
