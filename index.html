<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Neo — @iamneo80</title>
    <meta name="description" content="Neo on X. 21,298 followers, 930,406 views." />
    <style>
      :root {
        --bg: #060807;
        --ink: #f2f5f2;
        --muted: #9aa79c;
        --green: #3dff8e;
        --glass: rgba(255, 255, 255, 0.05);
        --glass-border: rgba(255, 255, 255, 0.09);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html { color-scheme: dark; -webkit-tap-highlight-color: transparent; }
      body {
        background:
          radial-gradient(720px 420px at 85% -80px, rgba(61, 255, 142, 0.13), transparent 65%),
          radial-gradient(620px 380px at -120px 45%, rgba(61, 255, 142, 0.06), transparent 60%),
          var(--bg);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      main {
        width: 100%;
        max-width: 880px;
        padding: 76px 24px 44px;
        flex: 1;
      }

      /* Entrance animation */
      @keyframes rise {
        from { opacity: 0; transform: translateY(22px); filter: blur(8px); }
        to { opacity: 1; transform: translateY(0); filter: blur(0); }
      }
      .anim { opacity: 0; animation: rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
      .d1 { animation-delay: 0.05s; }
      .d2 { animation-delay: 0.15s; }
      .d3 { animation-delay: 0.3s; }
      .d4 { animation-delay: 0.45s; }
      .d5 { animation-delay: 0.6s; }
      .d6 { animation-delay: 0.75s; }
      h1 .ch { display: inline-block; opacity: 0; animation: rise 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
      h1 .ch:nth-child(1) { animation-delay: 0.12s; }
      h1 .ch:nth-child(2) { animation-delay: 0.22s; }
      h1 .ch:nth-child(3) { animation-delay: 0.32s; }
      h1 .ch:nth-child(4) { animation-delay: 0.42s; }

      /* Hero */
      .avatar {
        width: 96px;
        height: 96px;
        border-radius: 50%;
        object-fit: cover;
        display: block;
        border: 2px solid rgba(61, 255, 142, 0.55);
        box-shadow: 0 12px 32px -10px rgba(61, 255, 142, 0.35);
        margin-bottom: 26px;
      }
      .kicker {
        font-size: 12px;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: var(--green);
        margin-bottom: 18px;
      }
      h1 {
        font-size: clamp(64px, 19vw, 150px);
        font-weight: 800;
        letter-spacing: -0.04em;
        line-height: 0.95;
      }
      h1 .dot { color: var(--green); }
      .tagline {
        margin-top: 22px;
        font-size: clamp(17px, 3.4vw, 21px);
        color: var(--muted);
        max-width: 46ch;
        line-height: 1.55;
      }
      .tagline strong { color: var(--ink); font-weight: 600; }

      /* Stats — iOS glass card */
      .stats {
        display: flex;
        flex-wrap: wrap;
        margin-top: 54px;
        background: var(--glass);
        border: 1px solid var(--glass-border);
        border-radius: 24px;
        -webkit-backdrop-filter: blur(18px) saturate(160%);
        backdrop-filter: blur(18px) saturate(160%);
        overflow: hidden;
      }
      .stat { flex: 1 1 160px; padding: 26px 28px; }
      .stat + .stat { border-left: 1px solid var(--glass-border); }
      .stat .num {
        display: block;
        font-size: clamp(30px, 6vw, 42px);
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.1;
        font-variant-numeric: tabular-nums;
      }
      .stat .lbl {
        display: block;
        margin-top: 6px;
        font-size: 11px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--muted);
      }

      /* Photo */
      .photo { margin-top: 28px; }
      .photo img {
        width: 100%;
        height: auto;
        display: block;
        border-radius: 24px;
        border: 1px solid var(--glass-border);
        box-shadow: 0 24px 60px -24px rgba(0, 0, 0, 0.8);
      }

      /* Transparent glass button */
      .cta { margin-top: 40px; display: flex; gap: 12px; flex-wrap: wrap; }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        background: rgba(255, 255, 255, 0.04);
        -webkit-backdrop-filter: blur(14px) saturate(160%);
        backdrop-filter: blur(14px) saturate(160%);
        border: 1px solid rgba(61, 255, 142, 0.45);
        color: var(--green);
        text-decoration: none;
        font-weight: 600;
        font-size: 16px;
        padding: 13px 26px;
        border-radius: 999px;
        transition: background 0.2s ease, transform 0.2s ease, border-color 0.2s ease;
      }
      .btn:hover {
        background: rgba(61, 255, 142, 0.12);
        border-color: rgba(61, 255, 142, 0.8);
        transform: translateY(-2px);
      }
      .btn:active { transform: translateY(0) scale(0.98); }
      .btn svg { flex: none; }

      footer {
        width: 100%;
        max-width: 880px;
        padding: 0 24px 36px;
        display: flex;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
        font-size: 13px;
        color: var(--muted);
      }
      footer a { color: var(--muted); text-decoration: none; }
      footer a:hover { color: var(--green); }

      @media (max-width: 560px) {
        main { padding: 48px 20px 118px; }
        .avatar { width: 76px; height: 76px; margin-bottom: 20px; }
        .tagline { margin-top: 16px; }
        .stats { flex-wrap: nowrap; margin-top: 36px; border-radius: 20px; }
        .stat { flex: 1 1 0; min-width: 0; padding: 16px 10px; }
        .stat + .stat { border-left: 1px solid var(--glass-border); border-top: none; }
        .stat .num { font-size: clamp(18px, 5.6vw, 24px); white-space: nowrap; }
        .stat .lbl { font-size: 9px; letter-spacing: 0.14em; }
        .photo { margin-top: 20px; }
        .photo img { aspect-ratio: 2 / 1; object-fit: cover; object-position: center; border-radius: 20px; }
        .cta {
          position: fixed;
          left: 0; right: 0; bottom: 0;
          margin: 0;
          padding: 12px 20px calc(12px + env(safe-area-inset-bottom));
          background: rgba(6, 8, 7, 0.55);
          -webkit-backdrop-filter: blur(18px) saturate(160%);
          backdrop-filter: blur(18px) saturate(160%);
          border-top: 1px solid var(--glass-border);
          z-index: 10;
        }
        .btn { width: 100%; justify-content: center; }
        footer { padding-bottom: calc(24px + env(safe-area-inset-bottom)); }
      }
      @media (prefers-reduced-motion: reduce) {
        .anim, h1 .ch { animation: none; opacity: 1; }
        .btn { transition: none; }
      }
    </style>
  </head>
  <body>
    <main>
      <picture>
        <source srcset="avatar.webp" type="image/webp" />
        <img class="avatar anim d1" src="avatar.jpg" alt="Neo profile picture" width="480" height="480" />
      </picture>
      <p class="kicker anim d2">@iamneo80 — on X</p>
      <h1 aria-label="Neo."><span class="ch">N</span><span class="ch">e</span><span class="ch">o</span><span class="ch dot">.</span></h1>
      <p class="tagline anim d3">Posting on <strong>X</strong>. Nothing else, nowhere else — this page is the whole portfolio.</p>

      <div class="stats anim d4" aria-label="X statistics">
        <div class="stat"><span class="num" data-count="21298">21,298</span><span class="lbl">Followers</span></div>
        <div class="stat"><span class="num" data-count="215">215</span><span class="lbl">Posts</span></div>
        <div class="stat"><span class="num" data-count="930406">930,406</span><span class="lbl">Views</span></div>
      </div>

      <div class="photo anim d5">
        <picture>
          <source srcset="photo.webp" type="image/webp" />
          <img src="photo.jpg" alt="Neo banner" width="1600" height="533" fetchpriority="high" />
        </picture>
      </div>

      <div class="cta anim d6">
        <a class="btn" href="https://x.com/iamneo80" target="_blank" rel="noopener noreferrer">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
          Follow on X
        </a>
      </div>
    </main>

    <footer>
      <span>© Neo</span>
      <a href="https://x.com/iamneo80" target="_blank" rel="noopener noreferrer">x.com/iamneo80</a>
    </footer>

    <script>
      // Count-up animation for the stats (skipped when reduced motion is preferred)
      (function () {
        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        var els = document.querySelectorAll(".num[data-count]");
        els.forEach(function (el) {
          var target = parseInt(el.getAttribute("data-count"), 10);
          var dur = 1200, start = null;
          function step(ts) {
            if (!start) start = ts;
            var p = Math.min((ts - start) / dur, 1);
            var eased = 1 - Math.pow(1 - p, 3);
            el.textContent = Math.round(target * eased).toLocaleString("en-US");
            if (p < 1) requestAnimationFrame(step);
          }
          requestAnimationFrame(step);
        });
      })();
    </script>
  </body>
</html>
