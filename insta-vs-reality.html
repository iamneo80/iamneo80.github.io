        <script>
      // Search filter + saved videos (bookmarks stored only on this device)
      (function () {
        var input = document.getElementById("vsearch");
        var list = document.querySelector(".list");
        if (!list) return;
        var items = Array.prototype.slice.call(list.querySelectorAll(".item"));
        var none = document.getElementById("vnone");
        var noneText = none ? none.textContent : "";
        var savedBtn = document.getElementById("savedBtn");
        var KEY = "neo-saved";
        function load() { try { return JSON.parse(localStorage.getItem(KEY) || "[]"); } catch (e) { return []; } }
        function store(a) { try { localStorage.setItem(KEY, JSON.stringify(a)); } catch (e) {} }
        var saved = load();
        var savedOnly = false;
        function idOf(a) { var m = /status\/(\d+)/.exec(a.getAttribute("href") || a.getAttribute("data-href") || ""); return m ? m[1] : ""; }
        function apply() {
          var q = input ? input.value.trim().toLowerCase() : "";
          var visible = 0;
          items.forEach(function (it) {
            var matchQ = !q || it.textContent.toLowerCase().indexOf(q) !== -1;
            var matchS = !savedOnly || saved.indexOf(idOf(it)) !== -1;
            var show = matchQ && matchS;
            it.style.display = show ? "" : "none";
            if (show) visible++;
          });
          if (none) {
            none.hidden = visible !== 0;
            if (visible === 0) none.textContent = savedOnly && !q ? "No saved videos yet." : noneText;
          }
        }
        items.forEach(function (it) {
          var b = it.querySelector(".save");
          if (!b) return;
          var id = idOf(it);
          if (!id) return;
          if (saved.indexOf(id) !== -1) b.classList.add("on");
          b.addEventListener("click", function (e) {
            e.preventDefault();
            e.stopPropagation();
            var i = saved.indexOf(id);
            if (i !== -1) { saved.splice(i, 1); b.classList.remove("on"); }
            else { saved.push(id); b.classList.add("on"); }
            store(saved);
            if (savedOnly) apply();
          });
        });
        if (input) input.addEventListener("input", apply);
        if (savedBtn) savedBtn.addEventListener("click", function () {
          savedOnly = !savedOnly;
          savedBtn.classList.toggle("on", savedOnly);
          savedBtn.setAttribute("aria-pressed", savedOnly ? "true" : "false");
          apply();
        });
        var sBtn = document.getElementById("searchBtn");
        var strip = document.querySelector(".search");
        if (sBtn && strip && input) {
          sBtn.addEventListener("click", function () {
            if (strip.hidden) { strip.hidden = false; input.focus(); }
            else { input.value = ""; apply(); strip.hidden = true; }
          });
          input.addEventListener("keydown", function (e) {
            if (e.key === "Escape") { input.value = ""; apply(); strip.hidden = true; }
          });
        }
        apply();
      })();
    </script>
    <script>
      // Automatic "New" badge: the newest video(s) on this page get it.
      // X post IDs grow over time, so the biggest ID in a link is the newest post.
      (function () {
        var list = document.querySelector(".list");
        if (!list) return;
        var n = parseInt(list.getAttribute("data-new-count") || "1", 10) || 1;
        var scored = [];
        Array.prototype.forEach.call(list.querySelectorAll(".item"), function (it) {
          var m = /status\/(\d+)/.exec(it.getAttribute("href") || "");
          if (m) scored.push({ el: it, id: m[1] });
        });
        scored.sort(function (a, b) {
          if (a.id.length !== b.id.length) return b.id.length - a.id.length;
          return a.id < b.id ? 1 : a.id > b.id ? -1 : 0;
        });
        scored.slice(0, n).forEach(function (s) {
          if (s.el.querySelector(".badge")) return;
          var b = document.createElement("span");
          b.className = "badge";
          b.textContent = "New";
          var go = s.el.querySelector(".save");
          if (go) s.el.insertBefore(b, go); else s.el.appendChild(b);
        });
      })();
    </script>

    <script>
      // Sort button opens a popup; tapping an option sorts the list
      (function () {
        var list = document.querySelector(".list");
        var btn = document.getElementById("sortBtn");
        var pop = document.getElementById("sortPop");
        if (!list || !btn || !pop) return;
        var items = Array.prototype.slice.call(list.querySelectorAll(".item"));
        items.forEach(function (a, i) { a.setAttribute("data-idx", i); });
        function idOf(a) { var m = /status\/(\d+)/.exec(a.getAttribute("href") || ""); return m ? m[1] : ""; }
        function cmpId(x, y) { return x.length !== y.length ? x.length - y.length : (x < y ? -1 : x > y ? 1 : 0); }
        function nameOf(a) { var n = a.querySelector(".nm"); return (n ? n.textContent : "").trim().toLowerCase(); }
        function close() { pop.classList.remove("open"); btn.setAttribute("aria-expanded", "false"); }
        btn.addEventListener("click", function (e) {
          e.stopPropagation();
          var open = pop.classList.toggle("open");
          btn.setAttribute("aria-expanded", open ? "true" : "false");
        });
        document.addEventListener("click", function (e) { if (!pop.contains(e.target)) close(); });
        document.addEventListener("keydown", function (e) { if (e.key === "Escape") close(); });
        pop.addEventListener("click", function (e) {
          var opt = e.target.closest ? e.target.closest(".sort-opt") : null;
          if (!opt) return;
          Array.prototype.forEach.call(pop.querySelectorAll(".sort-opt"), function (o) { o.classList.toggle("is-on", o === opt); });
          var mode = opt.getAttribute("data-sort");
          var sorted = items.slice();
          if (mode === "az") sorted.sort(function (a, b) { return nameOf(a).localeCompare(nameOf(b)); });
          else if (mode === "new") sorted.sort(function (a, b) { return cmpId(idOf(b), idOf(a)); });
          else if (mode === "old") sorted.sort(function (a, b) { return cmpId(idOf(a), idOf(b)); });
          else if (mode === "views") sorted.sort(function (a, b) { return (+b.getAttribute("data-views") || -1) - (+a.getAttribute("data-views") || -1); });
          else sorted.sort(function (a, b) { return (+a.getAttribute("data-idx")) - (+b.getAttribute("data-idx")); });
          sorted.forEach(function (a) { list.appendChild(a); });
          close();
        });
      })();
    </script>
        <script>
      // Live views + likes on each video row (public FxTwitter API; stored order untouched)
      (function () {
        var list = document.querySelector(".list");
        if (!list || !window.fetch) return;
        var items = Array.prototype.slice.call(list.querySelectorAll(".item"));
        if (!items.length) return;
        list.classList.add("vc-on");
        function fmt(v, dec) {
          if (v >= 999500) { var s = (v / 1e6).toFixed(2); s = s.replace(/\.?0+$/, ""); return s + "M"; }
          var s2 = (v / 1e3).toFixed(dec); if (dec === 2) s2 = s2.replace(/\.?0+$/, "");
          return s2 + "K";
        }
        items.forEach(function (a) {
          var m = /status\/(\d+)/.exec(a.getAttribute("href") || a.getAttribute("data-href") || "");
          if (!m) return;
          var vw = a.querySelector(".vw"), lk = a.querySelector(".lk"), rp = a.querySelector(".rp"), cm = a.querySelector(".cm"), meta = a.querySelector(".meta");
          if (!vw || !lk || !meta) return;
          fetch("https://api.fxtwitter.com/iamneo80/status/" + m[1]).then(function (r) { return r.json(); }).then(function (d) {
            var t = d && d.tweet;
            var ok = false;
            if (t) {
              if (typeof t.views === "number" && t.views > 0) { a.setAttribute("data-views", t.views); vw.textContent = fmt(t.views, 1); ok = true; }
              if (typeof t.likes === "number" && t.likes > 0) { lk.textContent = fmt(t.likes, 2); ok = true; }
              if (rp && typeof t.retweets === "number" && t.retweets >= 0) rp.textContent = t.retweets < 1000 ? String(t.retweets) : fmt(t.retweets, 2);
              if (cm && typeof t.replies === "number" && t.replies >= 0) cm.textContent = t.replies < 1000 ? String(t.replies) : fmt(t.replies, 2);
            }
            if (!ok) meta.style.display = "none";
          }).catch(function () { meta.style.display = "none"; });
        });
      })();
    </script>

    <script>
      // Subtle tap ripple on buttons and pills
      (function () {
        if (!window.PointerEvent) return;
        if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        var SEL = "button, .btn, .go, .latest-watch, .coll-open, .back, .newtoast-watch, .save";
        document.addEventListener("pointerdown", function (e) {
          var t = e.target && e.target.closest ? e.target.closest(SEL) : null;
          if (!t) return;
          var r = t.getBoundingClientRect();
          if (!r.width || !r.height) return;
          t.classList.add("ripple-host");
          var d = Math.max(r.width, r.height);
          var s = document.createElement("span");
          s.className = "ripple-ink";
          s.style.width = s.style.height = d + "px";
          s.style.left = (e.clientX - r.left - d / 2) + "px";
          s.style.top = (e.clientY - r.top - d / 2) + "px";
          t.appendChild(s);
          setTimeout(function () { s.remove(); }, 600);
        }, { passive: true });
      })();
    </script>
