<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <link rel="icon" type="image/png" sizes="64x64" href="favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <style>
      :root { --bg: #060807; --ink: #f2f5f2; --muted: #93a197; --green: #ffffff; --glass: rgba(255,255,255,0.05); --glass-border: rgba(255,255,255,0.1); }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html { color-scheme: dark; -webkit-tap-highlight-color: transparent; }
      body { background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Inter, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
      main { max-width: 880px; margin: 0 auto; padding: 28px 24px 48px; }
      .back { display: inline-flex; align-items: center; gap: 7px; color: var(--ink); text-decoration: none; font-size: 13.5px; font-weight: 600; border: 1px solid var(--glass-border); background: rgba(255,255,255,0.04); -webkit-backdrop-filter: blur(16px) saturate(160%); backdrop-filter: blur(16px) saturate(160%); padding: 9px 16px; border-radius: 999px; }
      .back:hover { color: var(--green); border-color: rgba(255,255,255,0.5); }
      h1 { margin-top: 30px; font-size: clamp(34px, 8vw, 54px); font-weight: 800; letter-spacing: 0.04em; }
      h1 .dot { color: var(--green); }
      .sub { margin-top: 6px; font-size: 12px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--green); }
      .list { margin-top: 30px; display: flex; flex-direction: column; gap: 12px; }
      .item { display: flex; align-items: center; gap: 13px; padding: 16px 20px; border-radius: 999px; border: 1px solid var(--glass-border); background: var(--glass); color: var(--ink); text-decoration: none; font-size: 15.5px; font-weight: 600; -webkit-backdrop-filter: blur(18px) saturate(160%); backdrop-filter: blur(18px) saturate(160%); }
      .item-play { flex-direction: column; align-items: stretch; gap: 0; cursor: pointer; transition: border-radius 0.25s ease; }
      .item-play.open { border-radius: 30px; }
      .item-play .irow { display: flex; align-items: center; gap: 13px; }
      .vpanel { margin-top: 14px; }
      .vpanel video { width: 100%; max-height: 62vh; object-fit: contain; display: block; border-radius: 20px; background: #000; }
      .mslider { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; border-radius: 20px; }
      .mslider::-webkit-scrollbar { display: none; }
      .mslide { flex: 0 0 100%; min-width: 0; scroll-snap-align: center; background: #000; border-radius: 20px; }
      .mslide .vphoto { width: 100%; height: 62vh; object-fit: contain; display: block; background: #000; border-radius: 20px; }
      .mdots { display: flex; gap: 6px; justify-content: center; margin-top: 11px; }
      .mdots i { width: 6px; height: 6px; border-radius: 50%; background: rgba(255, 255, 255, 0.3); }
      .mdots i.on { background: #ffffff; }
      .vpanel .vx { display: inline-block; margin-top: 11px; font-size: 13px; font-weight: 600; color: var(--muted); text-decoration: none; }
      .item:hover { border-color: rgba(255,255,255,0.5); }
      .item svg { width: 19px; height: 19px; color: var(--green); flex: none; }
      .item .go { margin-left: auto; color: var(--green); font-size: 13.5px; font-weight: 700; white-space: nowrap; }
      footer { margin-top: 44px; color: var(--muted); font-size: 13px; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
      footer a { color: var(--muted); text-decoration: none; }
      footer a:hover { color: var(--green); }
      @media (max-width: 640px) { main { padding: 20px 16px 40px; } }
      /* 18+ gate */
      .gate { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; padding: 20px; background: rgba(4,6,5,0.5); -webkit-backdrop-filter: blur(14px) saturate(140%); backdrop-filter: blur(14px) saturate(140%); opacity: 1; transition: opacity 0.35s ease; }
      .gate.hide { opacity: 0; pointer-events: none; }
      .gate-card { width: 100%; max-width: 340px; text-align: center; background: rgba(255,255,255,0.06); border: 1px solid var(--glass-border); border-radius: 26px; padding: 30px 26px 26px; -webkit-backdrop-filter: blur(22px) saturate(160%); backdrop-filter: blur(22px) saturate(160%); animation: gateIn 0.45s cubic-bezier(0.22,1,0.36,1); }
      @keyframes gateIn { from { opacity: 0; transform: translateY(14px) scale(0.97); } to { opacity: 1; transform: none; } }
      .gate-badge { display: inline-block; color: var(--green); border: 1.5px solid rgba(255,255,255,0.65); border-radius: 12px; padding: 5px 12px; font-weight: 800; letter-spacing: 0.08em; font-size: 17px; }
      .gate-q { margin-top: 16px; font-size: 18.5px; font-weight: 700; }
      .gate-btns { margin-top: 22px; display: flex; gap: 12px; }
      .gate-btns button { flex: 1; font: inherit; font-weight: 700; font-size: 15.5px; padding: 13px 0; border-radius: 999px; cursor: pointer; border: 1px solid var(--glass-border); background: rgba(255,255,255,0.05); color: var(--ink); }
      .gate-btns button:hover { border-color: rgba(255,255,255,0.55); }
      .gate-btns .yes { color: #06130b; background: var(--green); border-color: transparent; }
      .gate-msg { margin-top: 16px; color: var(--muted); font-size: 14.5px; line-height: 1.55; }
          .search { margin-top: 22px; display: flex; align-items: center; gap: 10px; padding: 13px 18px; border-radius: 999px; border: 1px solid var(--glass-border); background: var(--glass); -webkit-backdrop-filter: blur(18px) saturate(160%); backdrop-filter: blur(18px) saturate(160%); }
      .search svg { width: 16px; height: 16px; color: var(--muted); flex: none; }
      .search input { flex: 1; min-width: 0; background: none; border: none; outline: none; color: var(--ink); font-size: 15px; font-family: inherit; }
      .search input::placeholder { color: var(--muted); }
      .none { margin-top: 18px; color: var(--muted); font-size: 14px; text-align: center; }
      /* Sort button + popup options */
      .sortwrap { position: relative; display: flex; justify-content: flex-end; margin-top: 12px; }
      .sort-btn2 { font: inherit; font-size: 13px; font-weight: 700; padding: 8px 18px; border-radius: 999px; border: 1px solid var(--glass-border); background: var(--glass); color: var(--ink); cursor: pointer; -webkit-backdrop-filter: blur(18px) saturate(160%); backdrop-filter: blur(18px) saturate(160%); transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1), background 0.2s ease; }
      .sort-btn2:active { transform: scale(0.94); }
      .sort-pop { position: absolute; top: calc(100% + 8px); right: 0; z-index: 30; min-width: 176px; padding: 6px; border-radius: 18px; border: 1px solid var(--glass-border); background: rgba(18, 22, 19, 0.82); -webkit-backdrop-filter: blur(22px) saturate(160%); backdrop-filter: blur(22px) saturate(160%); box-shadow: 0 18px 44px rgba(0, 0, 0, 0.5); opacity: 0; visibility: hidden; transform: translateY(-5px) scale(0.97); transform-origin: top right; transition: opacity 0.18s ease, transform 0.18s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.18s; }
      .sort-pop.open { opacity: 1; visibility: visible; transform: translateY(0) scale(1); }
      .sort-opt { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; font: inherit; font-size: 14px; font-weight: 600; text-align: left; padding: 10px 13px; border: none; border-radius: 12px; background: none; color: var(--ink); cursor: pointer; }
      .sort-opt:hover { background: rgba(255, 255, 255, 0.08); }
      .sort-opt .dot { width: 7px; height: 7px; border-radius: 50%; background: #ffffff; flex: none; opacity: 0; }
      .sort-opt.is-on .dot { opacity: 1; }
      @media (prefers-reduced-motion: reduce) { .sort-btn2:active { transform: none; } .sort-pop { transition: none; } }
      /* Views count in rows, stagger-in, gate remember */
      .item .vcount { margin-left: auto; font-size: 12.5px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
      .list.vc-on .item .go { margin-left: 0; }
      .list.play .item { opacity: 0; animation: rowIn 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards; animation-delay: calc(var(--i, 0) * 35ms); }
      @keyframes rowIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
      .gate-rem { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 14px; font-size: 13px; color: var(--muted); cursor: pointer; }
      .gate-rem input { width: 16px; height: 16px; accent-color: #ffffff; cursor: pointer; }
      @media (prefers-reduced-motion: reduce) { .list.play .item { animation: none; opacity: 1; } }
      /* Subtle tap ripple */
      .ripple-host { position: relative; overflow: hidden; }
      .ripple-ink { position: absolute; border-radius: 50%; background: rgba(255, 255, 255, 0.16); transform: scale(0); opacity: 0.9; pointer-events: none; animation: ripIn 0.55s ease-out forwards; z-index: 1; }
      .go .ripple-ink, .latest-watch .ripple-ink, .yes .ripple-ink, .gate-yes .ripple-ink { background: rgba(0, 0, 0, 0.13); }
      @keyframes ripIn { to { transform: scale(2.4); opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .ripple-ink { display: none; } }
      .badge { background: var(--green); color: #04150a; font-size: 10.5px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
      .surprise { margin-top: 14px; width: 100%; padding: 14px 20px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.55); background: rgba(255,255,255,0.08); color: var(--green); font-size: 15px; font-weight: 700; font-family: inherit; cursor: pointer; -webkit-backdrop-filter: blur(18px) saturate(160%); backdrop-filter: blur(18px) saturate(160%); }
      .surprise:hover { background: rgba(255,255,255,0.16); }
    
      /* Button animations - iOS-style press feedback */
      .back, .item, .surprise, .gate-btns button { transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.2s ease, background 0.2s ease; }
      .back:active, .surprise:active, .gate-btns button:active { transform: scale(0.94); }
      .item:active { transform: scale(0.985); }
      @media (prefers-reduced-motion: reduce) { .back:active, .surprise:active, .gate-btns button:active, .item:active { transform: none; } }
  </style>

  <body>
    <div class="gate" id="gate" role="dialog" aria-modal="true" aria-label="Age verification">
      <div class="gate-card">
        <span class="gate-badge">18+</span>
        <p class="gate-q" id="gate-q">Are you 18 or older?</p>
        <div class="gate-btns" id="gate-btns">
          <button type="button" class="yes" id="gate-yes">Yes</button>
          <button type="button" id="gate-no">No</button>
        </div>
        <label class="gate-rem"><input type="checkbox" id="gate-rem" /><span>Remember me on this device</span></label>
        <p class="gate-msg" id="gate-msg" hidden>This page is 18+ only.</p>
      </div>
    </div>
    <main>
      <a class="back" href="index.html">Back</a>
      <h1>Others<span class="dot">.</span></h1>
      <p class="sub">Not my works</p>
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.8-3.8"/></svg>
        <input id="vsearch" type="search" placeholder="Search videos" aria-label="Search videos" autocomplete="off" />
      </div>
      <div class="sortwrap">
        <button type="button" class="sort-btn2" id="sortBtn" aria-haspopup="true" aria-expanded="false">Sort</button>
        <div class="sort-pop" id="sortPop" role="menu">
          <button type="button" class="sort-opt is-on" data-sort="default">Default<span class="dot"></span></button>
          <button type="button" class="sort-opt" data-sort="new">Newest<span class="dot"></span></button>
          <button type="button" class="sort-opt" data-sort="old">Oldest<span class="dot"></span></button>
          <button type="button" class="sort-opt" data-sort="az">A&ndash;Z<span class="dot"></span></button>
          <button type="button" class="sort-opt" data-sort="views">Most viewed<span class="dot"></span></button>
        </div>
      </div>
      <div class="list" data-new-count="2">
        <a class="item" href="https://x.com/iamneo80/status/1932655572689825932" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M10 9.5l5 2.5-5 2.5z" fill="currentColor" stroke="none"/></svg>Soumya<span class="go">Watch</span></a>
          <div class="item item-play" data-href="https://x.com/iamneo80/status/1933768223838855580"><span class="irow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M10 9.5l5 2.5-5 2.5z" fill="currentColor" stroke="none"/></svg>Anjana<span class="go">Watch now</span></span><div class="vpanel" hidden><div class="mslider"><div class="mslide"><video controls playsinline preload="none" poster="https://pbs.twimg.com/amplify_video_thumb/1933768134944800768/img/3qqzLWJejaX-sZwF.jpg" data-src="https://video.twimg.com/amplify_video/1933768134944800768/vid/avc1/720x1280/X8u8F7WV9FU1kBat.mp4?tag=14"></video></div><div class="mslide"><img class="vphoto" src="https://pbs.twimg.com/media/GtYf34pbkAAEH4V.jpg?name=medium" alt="Anjana photo" loading="lazy"></div></div><div class="mdots"><i class="on"></i><i></i></div><a class="vx" href="https://x.com/iamneo80/status/1933768223838855580" target="_blank" rel="noopener noreferrer">Watch on X</a></div></div>
      <p class="none" id="vnone" hidden>No videos match your search.</p>
      </div>
      <footer style="justify-content:center;">
        <span>&copy; 2026 Neo. All posts live on <a href="https://x.com/iamneo80" target="_blank" rel="noopener noreferrer">X</a>.</span>
      </footer>
    </main>
    <script>
      (function () {
        var gate = document.getElementById('gate');
        document.body.style.overflow = 'hidden';
        function unlock() { gate.classList.add('hide'); document.body.style.overflow = ''; try { sessionStorage.setItem('neo-age-ok', '1'); var rb = document.getElementById('gate-rem'); if (rb && rb.checked) localStorage.setItem('neo-age-remember', '' + Date.now()); } catch (e) {} setTimeout(function () { gate.remove(); }, 400); }
        var ok = false;
        try { ok = sessionStorage.getItem('neo-age-ok') === '1'; if (!ok) { var rem = +localStorage.getItem('neo-age-remember') || 0; if (rem && Date.now() - rem < 30 * 24 * 3600 * 1000) ok = true; } } catch (e) {}
        if (ok) { unlock(); }
        document.getElementById('gate-yes').addEventListener('click', unlock);
        document.getElementById('gate-no').addEventListener('click', function () {
          document.getElementById('gate-q').textContent = '18+ only';
          document.getElementById('gate-btns').style.display = 'none';
          document.getElementById('gate-msg').hidden = false;
        });
      })();
    </script>
    <script>
      // Live search filter for the video list
      (function () {
        var input = document.getElementById("vsearch");
        if (!input) return;
        var items = Array.prototype.slice.call(document.querySelectorAll(".item"));
        var none = document.getElementById("vnone");
        input.addEventListener("input", function () {
          var q = input.value.trim().toLowerCase();
          var visible = 0;
          items.forEach(function (it) {
            var show = !q || it.textContent.toLowerCase().indexOf(q) !== -1;
            it.style.display = show ? "" : "none";
            if (show) visible++;
          });
          if (none) none.hidden = visible !== 0;
        });
      })();
    </script>
    <script>
      if ("serviceWorker" in navigator) { navigator.serviceWorker.register("sw.js").catch(function () {}); }
    </script>
    <script>
      // Sort button opens a popup; tapping an option sorts the list
      (function () {
        var list = document.querySelector(".list");
        var btn = document.getElementById("sortBtn");
        var pop = document.getElementById("sortPop");
        if (!list || !btn || !pop) return;
        var items = Array.prototype.slice.call(list.querySelectorAll(".item"));
        items.forEach(function (a, i) { a.setAttribute("data-idx", i); });
        function idOf(a) { var m = /status\/(\d+)/.exec(a.getAttribute("href") || a.getAttribute("data-href") || ""); return m ? m[1] : ""; }
        function cmpId(x, y) { return x.length !== y.length ? x.length - y.length : (x < y ? -1 : x > y ? 1 : 0); }
        function nameOf(a) { var c = a.cloneNode(true); var g = c.querySelector(".go"); if (g) g.remove(); var b = c.querySelector(".badge"); if (b) b.remove(); var v = c.querySelector(".vcount"); if (v) v.remove(); return c.textContent.trim().toLowerCase(); }
        function close() { pop.classList.remove("open"); btn.setAttribute("aria-expanded", "false"); }
        btn.addEventListener("click", function (e) {
          e.stopPropagation();
          var open = pop.classList.toggle("open");
          btn.setAttribute("aria-expanded", open ? "true" : "false");
        });
        document.addEventListener("click", function (e) { if (!pop.contains(e.target)) close(); });
        document.addEventListener("keydown", function (e) { if (e.key === "Escape") close(); });
        pop.addEventListener("click", function (e) {
          var opt = e.target.closest ? e.target.closest(".sort-opt") : null;
          if (!opt) return;
          Array.prototype.forEach.call(pop.querySelectorAll(".sort-opt"), function (o) { o.classList.toggle("is-on", o === opt); });
          var mode = opt.getAttribute("data-sort");
          var sorted = items.slice();
          if (mode === "az") sorted.sort(function (a, b) { return nameOf(a).localeCompare(nameOf(b)); });
          else if (mode === "new") sorted.sort(function (a, b) { return cmpId(idOf(b), idOf(a)); });
          else if (mode === "old") sorted.sort(function (a, b) { return cmpId(idOf(a), idOf(b)); });
          else if (mode === "views") sorted.sort(function (a, b) { return (+b.getAttribute("data-views") || -1) - (+a.getAttribute("data-views") || -1); });
          else sorted.sort(function (a, b) { return (+a.getAttribute("data-idx")) - (+b.getAttribute("data-idx")); });
          sorted.forEach(function (a) { list.appendChild(a); });
          close();
        });
      })();
    </script>
    <script>
      // Live views count on each video row (public FxTwitter API; stored order untouched)
      (function () {
        var list = document.querySelector(".list");
        if (!list || !window.fetch) return;
        var items = Array.prototype.slice.call(list.querySelectorAll(".item"));
        if (!items.length) return;
        list.classList.add("vc-on");
        function fmt(v) {
          if (v >= 999500) { var s = (v / 1e6).toFixed(2); s = s.replace(/\.?0+$/, ""); return s + "M"; }
          return (v / 1e3).toFixed(1) + "K";
        }
        items.forEach(function (a) {
          var m = /status\/(\d+)/.exec(a.getAttribute("href") || a.getAttribute("data-href") || "");
          if (!m) return;
          var span = document.createElement("span");
          span.className = "vcount";
          var go = a.querySelector(".go");
          if (go) go.parentNode.insertBefore(span, go); else a.appendChild(span);
          fetch("https://api.fxtwitter.com/iamneo80/status/" + m[1]).then(function (r) { return r.json(); }).then(function (d) {
            var v = d && d.tweet && d.tweet.views;
            if (typeof v === "number" && v > 0) { a.setAttribute("data-views", v); span.textContent = fmt(v); }
          }).catch(function () { });
        });
      })();
    </script>
    <script>
      // Stagger the rows in after the age gate
      (function () {
        var list = document.querySelector(".list");
        if (!list) return;
        var items = list.querySelectorAll(".item");
        Array.prototype.forEach.call(items, function (a, i) { a.style.setProperty("--i", i); });
        function play() {
          list.classList.add("play");
          setTimeout(function () { list.classList.remove("play"); }, items.length * 35 + 700);
        }
        var y = document.getElementById("gate-yes");
        var ok = false;
        try { ok = sessionStorage.getItem("neo-age-ok") === "1"; } catch (e) { }
        if (ok || !y) play();
        else y.addEventListener("click", function () { setTimeout(play, 80); });
      })();
    </script>
    <script>
      // Subtle tap ripple on buttons and pills
      (function () {
        if (!window.PointerEvent) return;
        if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        var SEL = "button, .btn, .go, .latest-watch, .coll-open, .back, .newtoast-watch";
        document.addEventListener("pointerdown", function (e) {
          var t = e.target && e.target.closest ? e.target.closest(SEL) : null;
          if (!t) return;
          var r = t.getBoundingClientRect();
          if (!r.width || !r.height) return;
          t.classList.add("ripple-host");
          var d = Math.max(r.width, r.height);
          var s = document.createElement("span");
          s.className = "ripple-ink";
          s.style.width = s.style.height = d + "px";
          s.style.left = (e.clientX - r.left - d / 2) + "px";
          s.style.top = (e.clientY - r.top - d / 2) + "px";
          t.appendChild(s);
          setTimeout(function () { s.remove(); }, 600);
        }, { passive: true });
      })();
    </script>
    <script>
      // Inline player: tap the row and the video plays right here (no X script, no tracking).
      (function () {
        var item = document.querySelector(".item-play");
        if (!item) return;
        var panel = item.querySelector(".vpanel");
        var vid = item.querySelector("video");
        var go = item.querySelector(".go");
        var slider = item.querySelector(".mslider");
        var dots = item.querySelectorAll(".mdots i");
        if (slider) {
          var ticking = false;
          slider.addEventListener("scroll", function () {
            if (ticking) return;
            ticking = true;
            requestAnimationFrame(function () {
              ticking = false;
              var idx = Math.round(slider.scrollLeft / slider.clientWidth);
              Array.prototype.forEach.call(dots, function (d, i) { d.classList.toggle("on", i === idx); });
              if (idx !== 0) vid.pause();
            });
          }, { passive: true });
        }
        item.addEventListener("click", function (e) {
          if (e.target.closest("a") || e.target === vid) return;
          var open = item.classList.toggle("open");
          panel.hidden = !open;
          if (open) {
            if (!vid.getAttribute("src")) vid.setAttribute("src", vid.getAttribute("data-src"));
            var pr = vid.play();
            if (pr) pr.catch(function () {});
            go.textContent = "Close";
          } else {
            vid.pause();
            go.textContent = "Watch now";
          }
        });
      })();
    </script>
